name: ACLClouds Auto Renew

on:
  schedule:
    # 每两天执行一次，对应北京时间 (UTC+8) 早上 07:28 (即 UTC 23:28)
    - cron: '28 23 */2 * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: aclclouds-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 登录会话缓存：run_id 作为 key 保证每次刷新，restore-keys 命中上一次
      - uses: actions/cache@v4
        with:
          path: auth.json
          key: acl-session-${{ github.run_id }}
          restore-keys: |
            acl-session-

      # 浏览器二进制缓存：省掉每次约 300MB 的 Chromium 下载
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Install
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Unit tests
        run: |
          node test_ocr.mjs
          node repro-hidden-btn.mjs

      - name: Renew
        env:
          ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          ACL_SERVER_ID: ${{ secrets.ACL_SERVER_ID }}
          ACL_BASE_URL: ${{ vars.ACL_BASE_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node renew.mjs
