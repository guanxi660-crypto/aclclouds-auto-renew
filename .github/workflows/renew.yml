name: ACLClouds Auto Renew

on:
  schedule:
    # 每天执行一次，对应北京时间 (UTC+8) 早上 07:28 (即 UTC 23:28)
    # 续期窗口只有 1 天宽，间隔必须 <= 1 天才能保证不漏窗。
    # 未到窗口时脚本幂等返回（400 renewal_not_available 按成功处理），不会误报。
    - cron: '28 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: aclclouds-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 登录会话缓存：run_id 作为 key 保证每次刷新，restore-keys 命中上一次
      - uses: actions/cache@v4
        with:
          path: auth.json
          key: acl-session-${{ github.run_id }}
          restore-keys: |
            acl-session-

      # 浏览器二进制缓存：省掉每次约 300MB 的 Chromium 下载
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Install
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Unit tests
        run: |
          node test_classify.mjs
          node test_cap_pow.mjs
          node repro-hidden-btn.mjs

      - name: Renew
        env:
          ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          ACL_SERVER_ID: ${{ secrets.ACL_SERVER_ID }}
          ACL_BASE_URL: ${{ vars.ACL_BASE_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # PoW 求解并发度。GitHub runner 通常 4 vCPU，留一部分给浏览器。
          CAP_POW_WORKERS: '4'
        run: node renew.mjs

      # 运行记录只保留本次一条（KEEP_RUNS=0）。放在最后，避免删掉自己。
      # 需要保留排查用的历史时，把 KEEP_RUNS 调大即可。
      - name: Cleanup old runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_RUNS: '0'
        run: |
          runs=$(gh run list \
            --workflow="${{ github.workflow }}" \
            --limit=100 \
            --json databaseId \
            --jq '.[].databaseId')

          count=0
          for run_id in $runs; do
            if [ "$run_id" = "${{ github.run_id }}" ]; then
              echo "跳过本次运行: $run_id"
              continue
            fi
            count=$((count + 1))
            if [ "$count" -le "$KEEP_RUNS" ]; then
              echo "保留 #$count: $run_id"
            else
              echo "删除 #$count: $run_id"
              gh run delete "$run_id" || true
            fi
          done
